<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AK Learning Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f0f4ff;color:#222}
.wrap{max-width:480px;margin:auto;padding:16px}
h1{text-align:center;color:#4a3fd6;margin:8px 0}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}
input,select{width:100%;padding:12px;margin:6px 0;border:2px solid #dde;border-radius:10px;font-size:16px}
button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:12px;background:#4a3fd6;color:#fff;font-size:17px;font-weight:600}
button:disabled{background:#bbb}
button.alt{background:#fff;color:#4a3fd6;border:2px solid #4a3fd6}
button.opt{background:#fff;color:#222;border:2px solid #dde;text-align:left}
button.ok{background:#2ecc71!important;color:#fff!important;border-color:#2ecc71}
button.bad{background:#e74c3c!important;color:#fff!important;border-color:#e74c3c}
.hide{display:none}
.bar{height:8px;background:#dde;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#f39c12;width:100%;transition:width 1s linear}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.msg{color:#e74c3c;text-align:center;min-height:20px}
#load{position:fixed;inset:0;background:#fffc;display:flex;align-items:center;justify-content:center;font-size:20px}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}
</style>
</head>
<body>
<div class="wrap">
<h1>🎓 AK Learning Hub</h1>

<!-- लॉगिन / साइन-अप -->
<div id="sAuth" class="hide">
  <div class="row">
    <button class="alt" onclick="tab('l')">लॉगिन</button>
    <button class="alt" onclick="tab('s')">नया रजिस्ट्रेशन</button>
  </div>
  <div class="card" id="fLogin">
    <input id="ln" placeholder="पूरा नाम">
    <select id="lc"></select>
    <input id="lp" type="password" inputmode="numeric" maxlength="4" placeholder="4 अंकों का PIN">
    <button onclick="login()">लॉगिन करो</button>
  </div>
  <div class="card hide" id="fSign">
    <input id="sn" placeholder="पूरा नाम">
    <select id="sc"></select>
    <input id="sp" type="password" inputmode="numeric" maxlength="4" placeholder="4 अंकों का PIN बनाओ">
    <input id="sp2" type="password" inputmode="numeric" maxlength="4" placeholder="PIN दोबारा लिखो">
    <button onclick="signup()">रजिस्टर करो</button>
  </div>
  <div class="msg" id="am"></div>
  <button class="alt" style="font-size:13px;padding:8px" onclick="admin()">⚙️ एडमिन</button>
</div>

<!-- होम -->
<div id="sHome" class="hide">
  <div class="card">
    <div id="hi"></div>
    <h2 style="margin:8px 0">⭐ कुल अंक: <span id="pts">0</span></h2>
  </div>
  <div class="card"><b>विषय चुनो:</b><div id="subs"></div></div>
  <button onclick="lb()">🏆 लीडरबोर्ड</button>
  <button class="alt" onclick="logout()">लॉगआउट</button>
</div>

<!-- क्विज़ -->
<div id="sQuiz" class="hide">
  <div class="card">
    <div class="row"><b id="qn"></b><b id="qp"></b><b>⏱ <span id="tl">15</span></b></div>
    <div class="bar"><i id="bf"></i></div>
    <h3 id="qt"></h3>
    <div id="opts"></div>
  </div>
</div>

<!-- रिज़ल्ट -->
<div id="sRes" class="hide">
  <div class="card" style="text-align:center">
    <h2>🎉 शाबाश!</h2>
    <p>इस राउंड के अंक</p>
    <h1 id="rs">0</h1>
    <button onclick="home()">होम पर जाओ</button>
    <button class="alt" onclick="lb()">🏆 लीडरबोर्ड देखो</button>
  </div>
</div>

<!-- लीडरबोर्ड -->
<div id="sLb" class="hide">
  <div class="card"><h3>🏆 टॉप 20</h3><table id="lbt"></table></div>
  <button onclick="U?home():show('sAuth')">वापस</button>
</div>

<!-- एडमिन -->
<div id="sAdmin" class="hide">
  <div class="card">
    <h3>👨‍🏫 सभी स्टूडेंट्स</h3>
    <table id="ast"></table>
  </div>
  <button onclick="show('sAuth')">बंद करो</button>
</div>
</div>

<div id="load" class="hide">⏳ रुको...</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzt1YZTkt4GGM24CYTDIalJmT3sDKB8_X9Ubc287dBPD3zSEho0A1WLs9RvaHwfBabz3A/exec";
const $ = i => document.getElementById(i);
let U = JSON.parse(localStorage.getItem("akUser")||"null");
let Q=[], qi=0, pts=0, tm=null, locked=false, SUBS=[], AK="";

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function show(id){
  ["sAuth","sHome","sQuiz","sRes","sLb","sAdmin"].forEach(s=>$(s).classList.toggle("hide",s!=id));
  window.scrollTo(0,0);
}
async function call(d,quiet){
  if(!quiet) $("load").classList.remove("hide");
  try{
    const r = await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)});
    return await r.json();
  }catch(e){
    return {ok:false,msg:"इंटरनेट या URL में समस्या है"};
  }finally{
    $("load").classList.add("hide");
  }
}

/* क्लास की लिस्ट */
["lc","sc"].forEach(id=>{
  let h='<option value="">क्लास चुनो</option>';
  for(let i=1;i<=10;i++) h+=`<option value="${i}">क्लास ${i}</option>`;
  $(id).innerHTML=h;
});

/* लॉगिन / साइन-अप */
function tab(t){
  $("fLogin").classList.toggle("hide",t!="l");
  $("fSign").classList.toggle("hide",t!="s");
  $("am").textContent="";
}
function save(r,pin){
  U={studentId:r.studentId,name:r.name,cls:r.cls,pin:pin};
  localStorage.setItem("akUser",JSON.stringify(U));
  home();
}
async function login(){
  const r = await call({action:"login",name:$("ln").value,cls:$("lc").value,pin:$("lp").value});
  if(!r.ok) return $("am").textContent=r.msg;
  save(r,$("lp").value);
}
async function signup(){
  const p=$("sp").value;
  if(p!==$("sp2").value) return $("am").textContent="PIN मेल नहीं खाया";
  const r = await call({action:"signup",name:$("sn").value,cls:$("sc").value,pin:p});
  if(!r.ok) return $("am").textContent=r.msg;
  save(r,p);
}
function logout(){
  localStorage.removeItem("akUser"); U=null; show("sAuth");
}

/* होम */
async function home(){
  show("sHome");
  $("hi").textContent="नमस्ते, "+U.name+" 👋  (ID: "+U.studentId+")";
  const r = await call({action:"subjects",studentId:U.studentId,pin:U.pin});
  if(!r.ok){ alert(r.msg); return logout(); }
  SUBS=r.subjects;
  $("pts").textContent=r.points;
  $("subs").innerHTML = SUBS.map((s,i)=>
    `<button onclick="start(${i})" ${s.left?"":"disabled"}>${esc(s.subject)} — ${s.left}/${s.total} बाकी</button>`
  ).join("") || "अभी कोई सवाल नहीं है";
}

/* क्विज़ */
async function start(i){
  const r = await call({action:"questions",studentId:U.studentId,pin:U.pin,subject:SUBS[i].subject});
  if(!r.ok || !r.questions.length) return alert(r.msg||"इस विषय के सारे सवाल हो चुके!");
  Q=r.questions; qi=0; pts=0; show("sQuiz"); nextQ();
}
function nextQ(){
  if(qi>=Q.length){ $("rs").textContent=pts; show("sRes"); return; }
  locked=false;
  const q=Q[qi], L="ABCD";
  $("qn").textContent="सवाल "+(qi+1)+"/"+Q.length;
  $("qp").textContent="अंक: "+pts;
  $("qt").textContent=q.q;
  $("opts").innerHTML = q.opts.map((o,k)=>`<button class="opt" id="o${L[k]}" onclick="pick('${L[k]}')"></button>`).join("");
  q.opts.forEach((o,k)=>$("o"+L[k]).textContent=L[k]+". "+o);
  let t=15;
  $("tl").textContent=t;
  $("bf").style.transition="none"; $("bf").style.width="100%";
  setTimeout(()=>{ $("bf").style.transition="width 1s linear"; },50);
  clearInterval(tm);
  tm=setInterval(()=>{
    t--; $("tl").textContent=t; $("bf").style.width=(t/15*100)+"%";
    if(t<=0){ clearInterval(tm); pick(""); }
  },1000);
}
async function pick(c){
  if(locked) return;
  locked=true; clearInterval(tm);
  const q=Q[qi];
  const r = await call({action:"answer",studentId:U.studentId,pin:U.pin,qid:q.id,choice:c},true);
  if(r.ok){
    if(c) $("o"+c).classList.add(r.correct?"ok":"bad");
    const e=$("o"+r.answer); if(e) e.classList.add("ok");
    pts+=r.points; $("qp").textContent="अंक: "+pts;
  }
  setTimeout(()=>{ qi++; nextQ(); },1500);
}

/* लीडरबोर्ड */
async function lb(){
  show("sLb");
  const r = await call({action:"leaderboard"});
  $("lbt").innerHTML = r.ok ? r.top.map((s,i)=>
    `<tr><td>${i+1}</td><td>${esc(s.name)} (क्लास ${s.cls})</td><td><b>${s.points}</b></td></tr>`
  ).join("") : "";
}

/* एडमिन */
async function admin(){
  AK=prompt("एडमिन कुंजी:"); if(!AK) return;
  const r = await call({action:"admin_students",adminKey:AK});
  if(!r.ok) return alert(r.msg);
  show("sAdmin");
  $("ast").innerHTML = r.students.map(s=>
    `<tr><td>${esc(s.id)}</td><td>${esc(s.name)} (${s.cls})</td><td>${s.points}</td>
     <td><button style="padding:6px;width:auto;font-size:13px" onclick="rp('${esc(s.id)}')">PIN बदलो</button></td></tr>`
  ).join("");
}
async function rp(id){
  const p=prompt("नया 4 अंकों का PIN:"); if(!p) return;
  const r = await call({action:"admin_resetpin",adminKey:AK,studentId:id,newPin:p});
  alert(r.ok?"PIN बदल गया ✅":r.msg);
}

/* शुरुआत */
if(U) home(); else show("sAuth");
</script>
</body>
</html>
