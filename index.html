<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AK Learning Hub 🌟 Kids Learning App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #F4F7FF; --bg-card: #FFFFFF; --text-main: #1E293B; --text-muted: #64748B;
      --grad-purple: linear-gradient(135deg, #7C3AED 0%, #A855F7 100%);
      --grad-blue: linear-gradient(135deg, #2563EB 0%, #38BDF8 100%);
      --grad-teal: linear-gradient(135deg, #0D9488 0%, #2DD4BF 100%);
      --grad-orange: linear-gradient(135deg, #EA580C 0%, #FB923C 100%);
      --grad-pink: linear-gradient(135deg, #DB2777 0%, #F472B6 100%);
      --grad-indigo: linear-gradient(135deg, #4F46E5 0%, #818CF8 100%);
      --grad-gold: linear-gradient(135deg, #F59E0B 0%, #FCD34D 100%);
      --radius-lg: 24px; --radius-md: 20px;
      --shadow-soft: 0 10px 25px -5px rgba(30, 41, 59, 0.08);
      --shadow-pop: 0 14px 28px -8px rgba(124, 58, 237, 0.28);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    input, select { user-select: text; }
    body { margin: 0; font-family: 'Baloo 2', 'Poppins', sans-serif; background: radial-gradient(circle at top left, #E0E7FF 0%, #F8FAFF 45%, #FCE7F3 100%); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; }
    .app-shell { width: 100%; max-width: 440px; min-height: 100vh; background: #F8FAFF; position: relative; display: flex; flex-direction: column; box-shadow: 0 0 45px rgba(79, 70, 229, 0.12); overflow-x: hidden; }
    #confetti-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
    .top-bar { padding: 12px 14px 8px; display: flex; align-items: center; justify-content: space-between; gap: 6px; background: rgba(248, 250, 255, 0.94); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 50; }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand-logo { width: 38px; height: 38px; border-radius: 13px; background: var(--grad-purple); flex-shrink: 0; display: grid; place-items: center; font-size: 19px; box-shadow: 0 6px 14px rgba(124, 58, 237, 0.28); cursor: pointer; }
    .brand-title { font-size: 17px; font-weight: 800; line-height: 1.05; white-space: nowrap; background: var(--grad-purple); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sync-dot { font-size: 10.5px; font-weight: 700; color: var(--text-muted); display: block; margin-top: 2px; white-space: nowrap; }
    .stats-pill-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .stat-pill { display: flex; align-items: center; gap: 4px; background: #FFFFFF; padding: 5px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; box-shadow: var(--shadow-soft); border: 2px solid #F1F5F9; transition: transform 0.25s; white-space: nowrap; }
    .stat-pill.bump { transform: scale(1.18); border-color: #FBBF24; }
    .level-pill { background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%); color: #92400E; border-color: #FCD34D; font-size: 11px; padding: 5px 9px; }
    .main-content { flex: 1; padding: 8px 18px 104px; }
    .screen, .auth-screen { display: none; animation: fadeSlideUp 0.3s ease; }
    .screen.active, .auth-screen.active { display: block; }
    .auth-screen { padding: 10px 18px 36px; }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .auth-hero { background: linear-gradient(135deg, #4F46E5 0%, #8B5CF6 55%, #EC4899 100%); border-radius: var(--radius-lg); padding: 20px; color: #FFFFFF; text-align: center; box-shadow: var(--shadow-pop); margin-bottom: 16px; }
    .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #E2E8F0; padding: 5px; border-radius: 18px; margin-bottom: 16px; }
    .auth-tab-btn { border: none; border-radius: 14px; padding: 10px; font-family: inherit; font-size: 15px; font-weight: 800; background: transparent; color: var(--text-muted); cursor: pointer; }
    .auth-tab-btn.active { background: #FFFFFF; color: #6D28D9; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
    .auth-card { background: #FFFFFF; border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-soft); border: 2px solid #EEF2FF; }
    .mascot-card { background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 55%, #EC4899 100%); border-radius: var(--radius-lg); padding: 18px 20px; color: #FFFFFF; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-pop); margin-bottom: 18px; }
    .owl-avatar { width: 68px; height: 68px; flex-shrink: 0; background: rgba(255, 255, 255, 0.22); border-radius: 22px; display: grid; place-items: center; animation: floatBob 3s ease-in-out infinite; }
    @keyframes floatBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .mascot-greeting { font-size: 19px; font-weight: 800; line-height: 1.25; margin: 0 0 4px; }
    .mascot-sub { margin: 0; font-size: 13px; opacity: 0.95; font-weight: 600; }
    .goal-card { background: var(--bg-card); border-radius: var(--radius-md); padding: 16px 18px; box-shadow: var(--shadow-soft); margin-bottom: 18px; border: 2px solid #EEF2FF; }
    .goal-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 15px; margin-bottom: 10px; }
    .progress-track { height: 14px; background: #E2E8F0; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #10B981 0%, #34D399 100%); border-radius: 999px; transition: width 0.5s; }
    .section-title { font-size: 20px; font-weight: 800; margin: 0 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .subject-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .subject-card { border: none; border-radius: var(--radius-lg); padding: 20px 14px; color: #FFFFFF; text-align: center; cursor: pointer; box-shadow: 0 10px 20px -6px rgba(15, 23, 42, 0.22); font-family: inherit; }
    .subject-card:nth-child(1) { background: var(--grad-purple); }
    .subject-card:nth-child(2) { background: var(--grad-blue); }
    .subject-card:nth-child(3) { background: var(--grad-orange); }
    .subject-card:nth-child(4) { background: var(--grad-teal); }
    .subject-card:nth-child(5) { background: var(--grad-pink); }
    .subject-card:nth-child(6) { background: var(--grad-indigo); }
    .subject-card:active { transform: scale(0.93); }
    .subject-emoji { font-size: 42px; display: block; margin-bottom: 8px; }
    .subject-name { font-size: 19px; font-weight: 800; display: block; }
    .subject-meta { font-size: 12px; font-weight: 600; background: rgba(255, 255, 255, 0.24); padding: 3px 10px; border-radius: 999px; display: inline-block; margin-top: 6px; }
    .btn-bounce { border: none; border-radius: 20px; padding: 13px 20px; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 5px 0 rgba(0, 0, 0, 0.14); }
    .btn-bounce:active { transform: translateY(3px) scale(0.96); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.14); }
    .btn-primary { background: var(--grad-purple); color: #FFFFFF; width: 100%; }
    .quiz-topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .btn-close-quiz { width: 44px; height: 44px; border-radius: 16px; border: none; background: #FFFFFF; box-shadow: var(--shadow-soft); font-size: 20px; font-weight: 800; cursor: pointer; }
    .timer-badge { display: flex; align-items: center; gap: 6px; background: #FEF3C7; color: #B45309; padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: 17px; border: 2px solid #FDE68A; }
    .timer-badge.urgent { background: #FEE2E2; color: #DC2626; border-color: #FCA5A5; }
    .quiz-progress-wrap { margin-bottom: 18px; }
    .quiz-progress-labels { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
    .question-card { background: #FFFFFF; border-radius: var(--radius-lg); padding: 24px 18px; box-shadow: var(--shadow-soft); text-align: center; margin-bottom: 18px; border: 3px solid #EEF2FF; }
    .question-tag { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: #EEF2FF; color: #4F46E5; margin-bottom: 10px; }
    .question-text { font-size: 22px; font-weight: 800; line-height: 1.35; margin: 0; }
    .options-list { display: flex; flex-direction: column; gap: 12px; }
    .option-btn { width: 100%; min-height: 58px; padding: 13px 16px; border-radius: 20px; border: 3px solid #E2E8F0; background: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer; box-shadow: 0 5px 0 #E2E8F0; }
    .option-letter { width: 36px; height: 36px; border-radius: 12px; background: #F1F5F9; display: grid; place-items: center; font-weight: 800; color: #475569; flex-shrink: 0; }
    .option-btn.correct { background: #ECFDF5; border-color: #10B981; color: #065F46; box-shadow: 0 0 22px rgba(16, 185, 129, 0.45); }
    .option-btn.correct .option-letter { background: #10B981; color: #FFFFFF; }
    .option-btn.wrong { background: #FEF2F2; border-color: #EF4444; color: #991B1B; animation: gentleShake 0.42s; }
    .option-btn.wrong .option-letter { background: #EF4444; color: #FFFFFF; }
    @keyframes gentleShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .feedback-banner { margin-top: 16px; padding: 14px 18px; border-radius: 20px; font-weight: 800; font-size: 17px; text-align: center; display: none; }
    .feedback-banner.success { display: block; background: #D1FAE5; color: #065F46; border: 2px solid #34D399; }
    .feedback-banner.retry { display: block; background: #FFEDD5; color: #9A3412; border: 2px solid #FB923C; }
    .floating-points { position: fixed; top: 72px; right: 28px; background: var(--grad-gold); color: #78350F; font-weight: 800; font-size: 18px; padding: 6px 14px; border-radius: 999px; z-index: 100; pointer-events: none; animation: floatScore 1.1s ease-out forwards; }
    @keyframes floatScore { 0% { opacity: 0; transform: translateY(10px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-38px); } }
    .summary-card { background: #FFFFFF; border-radius: var(--radius-lg); padding: 28px 22px; text-align: center; box-shadow: var(--shadow-soft); }
    .game-card { background: #FFFFFF; border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-soft); margin-bottom: 16px; border: 2px solid #F1F5F9; }
    .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
    .mem-tile { aspect-ratio: 1; border-radius: 18px; border: none; background: var(--grad-blue); color: #FFFFFF; font-size: 28px; font-weight: 800; cursor: pointer; box-shadow: 0 5px 0 #1D4ED8; }
    .mem-tile.flipped, .mem-tile.matched { background: #FFFFFF; border: 3px solid #38BDF8; box-shadow: var(--shadow-soft); }
    .mem-tile.matched { border-color: #10B981; background: #ECFDF5; }
    .podium-wrap { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 16px 0 22px; }
    .podium-item { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .podium-avatar { width: 56px; height: 56px; border-radius: 50%; background: #FFFFFF; display: grid; place-items: center; font-size: 30px; box-shadow: var(--shadow-soft); border: 3px solid #FFFFFF; margin-bottom: 6px; }
    .podium-item.first .podium-avatar { width: 68px; height: 68px; font-size: 36px; border-color: #FBBF24; }
    .podium-name { font-weight: 800; font-size: 14px; max-width: 96px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .podium-class { font-size: 11px; font-weight: 700; color: #6366F1; }
    .podium-score { font-size: 13px; font-weight: 700; color: #64748B; margin-bottom: 8px; }
    .podium-block { width: 100%; border-radius: 20px 20px 10px 10px; color: #FFFFFF; font-weight: 800; font-size: 24px; display: flex; align-items: center; justify-content: center; }
    .podium-item.first .podium-block  { height: 112px; background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%); }
    .podium-item.second .podium-block { height: 86px;  background: linear-gradient(180deg, #94A3B8 0%, #64748B 100%); }
    .podium-item.third .podium-block  { height: 70px;  background: linear-gradient(180deg, #EA580C 0%, #C2410C 100%); }
    .rank-list { display: flex; flex-direction: column; gap: 10px; }
    .rank-row { background: #FFFFFF; border-radius: 20px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-soft); border: 2px solid transparent; }
    .rank-row.is-me { background: linear-gradient(135deg, #EEF2FF 0%, #FCE7F3 100%); border-color: #8B5CF6; }
    .rank-num { width: 30px; font-weight: 800; font-size: 16px; color: var(--text-muted); text-align: center; }
    .rank-avatar { width: 42px; height: 42px; border-radius: 14px; background: #F1F5F9; display: grid; place-items: center; font-size: 22px; }
    .rank-info { flex: 1; }
    .rank-name { font-weight: 800; font-size: 16px; }
    .rank-badge-mini { font-size: 12px; font-weight: 700; color: #6366F1; }
    .rank-points { font-weight: 800; font-size: 16px; color: #B45309; background: #FEF3C7; padding: 5px 12px; border-radius: 999px; }
    .profile-hero { background: var(--grad-teal); border-radius: var(--radius-lg); padding: 22px; color: #FFFFFF; text-align: center; box-shadow: var(--shadow-soft); margin-bottom: 18px; }
    .profile-avatar-big { width: 82px; height: 82px; border-radius: 26px; background: rgba(255, 255, 255, 0.28); margin: 0 auto 10px; display: grid; place-items: center; font-size: 46px; }
    .avatar-picker { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .avatar-opt { width: 40px; height: 40px; border-radius: 13px; border: 2px solid transparent; background: rgba(255,255,255,0.24); font-size: 21px; cursor: pointer; }
    .avatar-opt.selected { border-color: #FFFFFF; background: rgba(255,255,255,0.45); transform: scale(1.1); }
    .avatar-opt.light-bg { background: #F1F5F9; }
    .avatar-opt.light-bg.selected { border-color: #7C3AED; background: #EDE9FE; }
    .field-input, .field-select { width: 100%; border: 2px solid #E2E8F0; border-radius: 16px; padding: 11px 14px; font-family: inherit; font-size: 15px; font-weight: 700; outline: none; background: #FFFFFF; color: var(--text-main); }
    .field-input:focus, .field-select:focus { border-color: #8B5CF6; }
    .badges-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .badge-tile { background: #FFFFFF; border-radius: 20px; padding: 14px 8px; text-align: center; box-shadow: var(--shadow-soft); border: 2px solid #F1F5F9; }
    .badge-tile.locked { opacity: 0.48; filter: grayscale(0.8); }
    .badge-tile.unlocked { border-color: #FCD34D; background: linear-gradient(180deg, #FFFFFF 0%, #FFFBEB 100%); }
    .admin-card { background: #FFFFFF; border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-soft); border: 2px solid #E0E7FF; margin-bottom: 16px; }
